name: Enhance real product images

on:
  push:
    paths:
      - 'scripts/enhance_products_real.py'
      - '.github/workflows/enhance-real-product-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build real enhanced product JPGs
        run: python scripts/enhance_products_real.py

      - name: Commit enhanced images to site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ktir-rkhis-store/assets/enhanced-real ktir-rkhis-store/real-enhanced-batch4.js ktir-rkhis-store/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Replace products 31-40 with real enhanced JPGs"
            git push origin HEAD:main
          fi
